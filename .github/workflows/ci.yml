name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # *ApplicationTests start the whole Spring context and need Postgres, Eureka and real secrets,
      # so CI runs the unit tests only (the same set as locally).
      - name: Build and test
        run: mvn -B -ntp verify -Dtest='*Test' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          retention-days: 7

  docker:
    name: Docker images (Jib)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check the compose files
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Build every image
        run: mvn -B -ntp -DskipTests package jib:dockerBuild
      - name: List images
        run: docker images "airline/*"
