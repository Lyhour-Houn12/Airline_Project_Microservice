server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import:
      - optional:configserver:http://localhost:8888
      - optional:file:./.env[.properties]   # local secrets, never committed (see .env.example)
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  flyway:
    baseline-on-migrate: true   # a database made before Flyway starts at V1 (already there)
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true        # Gmail (and every real mail server) needs the login
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: user-service
    access-token-minutes: 15
    refresh-token-days: 7
  otp:
    expiry-minutes: 5
    max-attempts: 5             # wrong guesses before the code is burned
    resend-cooldown-seconds: 60
  login-protection:
    max-failed-attempts: 5
    lockout-minutes: 15
  mail:
    enabled: ${MAIL_ENABLED:false}   # false = codes are printed in the log (dev). true = real email (set MAIL_* in .env)
    from: ${MAIL_FROM:no-reply@localhost}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}   # docker: http://discovery-server:8761/eureka/
