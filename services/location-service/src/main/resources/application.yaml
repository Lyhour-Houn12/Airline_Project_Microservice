server:
  port: 5004

spring:
  application:
    name: location-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/location_service
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true   # a database made before Flyway starts at V1 (already there)
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: true
    properties:
      hibernate:
        format_sql: true


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}   # docker: http://discovery-server:8761/eureka/
