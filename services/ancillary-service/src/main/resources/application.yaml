server:
  port: 8089   # change to whatever is free in your setup

spring:
  application:
    name: ancillary-service
  config:
    import:
      - optional:configserver:http://localhost:8888
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/ancillary_db
    username: admin
    password: admin
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    baseline-on-migrate: true   # a database made before Flyway starts at V1 (already there)
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (src/main/resources/db/migration)
    properties:
      hibernate:
        format_sql: true





cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}