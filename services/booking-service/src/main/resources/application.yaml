server:
  port: 8066

spring:
  application:
    name: booking-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  flyway:
    baseline-on-migrate: true   # a database made before Flyway starts at V1 (already there)
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (src/main/resources/db/migration)

booking:
  hold-minutes: 15            # an unpaid booking (and its held seats) expires after this
  child-fare-percent: 100     # share of the adult fare a CHILD pays
  infant-fare-percent: 10     # share of the adult fare an INFANT (on a lap, no seat) pays
  expiry-check-millis: 60000  # how often unpaid bookings are expired

outbox:
  poll-millis: 5000   # how often undelivered messages to other services are retried
